<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vortex - Presenca semanal</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#0b0d11; --surface:#13161d; --card:#1a1e28; --border:#252a38;
    --accent:#5865f2; --accent2:#57f287; --text:#e8eaf0; --muted:#8b94a7; --danger:#ed4245;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Syne', sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; overflow-x:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(88,101,242,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(88,101,242,.035) 1px, transparent 1px);
    background-size:40px 40px; pointer-events:none; z-index:0;
  }
  .container { max-width:1100px; margin:0 auto; padding:40px 24px; position:relative; z-index:1; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:42px; }
  .logo { display:flex; align-items:center; gap:12px; min-width:0; }
  .logo-icon { width:38px; height:38px; background:var(--accent); border-radius:8px; display:grid; place-items:center; font-weight:800; }
  .logo-text { font-size:20px; font-weight:800; letter-spacing:0; }
  .logo-text span { color:var(--accent); }
  .semana-label {
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted);
    background:var(--surface); border:1px solid var(--border); padding:6px 14px; border-radius:999px;
  }
  .selector-section { margin-bottom:40px; }
  .selector-label {
    font-size:11px; font-weight:700; letter-spacing:2px; color:var(--muted);
    text-transform:uppercase; margin-bottom:14px;
  }
  .user-grid { display:flex; flex-wrap:wrap; gap:10px; }
  .user-btn {
    display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:10px 14px; cursor:pointer; transition:all .2s; color:var(--text);
    font-family:'Syne', sans-serif; font-size:14px; font-weight:700; max-width:100%;
  }
  .user-btn:hover { border-color:var(--accent); background:var(--card); }
  .user-btn.active { border-color:var(--accent); background:rgba(88,101,242,.16); color:#fff; }
  .user-btn img { width:28px; height:28px; border-radius:50%; object-fit:cover; flex:0 0 auto; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--accent2); flex:0 0 auto; }
  #perfil { display:none; }
  #perfil.visible { display:block; animation:fadeUp .28s ease; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  .profile-card {
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:26px 30px;
    display:flex; align-items:center; gap:24px; margin-bottom:32px; position:relative; overflow:hidden;
  }
  .profile-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
  .profile-avatar { width:72px; height:72px; border-radius:50%; border:3px solid var(--accent); object-fit:cover; flex-shrink:0; }
  .profile-info { flex:1; min-width:0; }
  .profile-name { font-size:24px; font-weight:800; margin-bottom:4px; overflow-wrap:anywhere; }
  .profile-id { font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted); overflow-wrap:anywhere; }
  .profile-stats { display:flex; gap:28px; }
  .stat { text-align:center; min-width:74px; }
  .stat-val { font-size:26px; font-weight:800; color:var(--accent2); font-family:'JetBrains Mono', monospace; line-height:1.1; }
  .stat-label { font-size:11px; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:1px; }
  .section-title {
    font-size:13px; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:var(--muted);
    margin-bottom:20px; display:flex; align-items:center; gap:10px;
  }
  .section-title::after { content:''; flex:1; height:1px; background:var(--border); }
  .week-grid { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:12px; margin-bottom:32px; }
  .day-card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:18px 14px; position:relative; overflow:hidden; }
  .day-card.ativo { border-color:var(--day-color); }
  .day-card.ativo::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--day-color); }
  .day-card.vazio { opacity:.5; }
  .day-header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px; }
  .day-name { font-size:11px; font-weight:800; letter-spacing:2px; color:var(--day-color, var(--muted)); }
  .day-date { font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--muted); }
  .day-horas { font-family:'JetBrains Mono', monospace; font-size:25px; line-height:1; color:var(--text); margin-bottom:4px; white-space:nowrap; }
  .day-horas span { font-size:13px; color:var(--muted); }
  .day-bar-wrap { height:4px; background:var(--border); border-radius:2px; margin-top:12px; overflow:hidden; }
  .day-bar { height:100%; border-radius:2px; background:var(--day-color, var(--accent)); transition:width .45s ease; }
  .day-sessoes { margin-top:14px; display:flex; flex-direction:column; gap:6px; }
  .sessao-pill {
    display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--surface);
    border-radius:8px; padding:6px 8px; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--muted);
  }
  .sessao-pill .horario { color:var(--text); font-weight:500; }
  .sessao-pill .duracao { background:rgba(88,101,242,.2); color:#aeb5ff; padding:2px 6px; border-radius:4px; font-size:9px; white-space:nowrap; }
  .empty-state { text-align:center; padding:60px 0; color:var(--muted); }
  .empty-state .icon { font-size:44px; margin-bottom:16px; }
  .total-bar {
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:20px 26px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .total-label { font-size:13px; color:var(--muted); font-weight:700; letter-spacing:1px; text-transform:uppercase; }
  .total-val { font-family:'JetBrains Mono', monospace; font-size:30px; font-weight:500; color:var(--accent2); }
  .total-sessoes { font-size:13px; color:var(--muted); margin-top:3px; }
  .total-sessoes a { color:#aeb5ff; text-decoration:none; font-weight:700; }
  .total-sessoes a:hover { text-decoration:underline; }
  @media (max-width: 900px) {
    .week-grid { grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .profile-card { align-items:flex-start; flex-wrap:wrap; }
    .profile-stats { width:100%; justify-content:space-between; gap:12px; }
  }
  @media (max-width: 560px) {
    .container { padding:26px 16px; }
    header { align-items:flex-start; flex-direction:column; }
    .week-grid { grid-template-columns:1fr; }
    .profile-card { padding:22px 18px; }
    .profile-stats { display:grid; grid-template-columns:1fr; }
    .total-bar { align-items:flex-start; flex-direction:column; }
    .total-val { font-size:26px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">
      <div class="logo-icon">V</div>
      <div class="logo-text">Folha<span>Ponto</span></div>
    </div>
    <div class="semana-label" id="semana-range">carregando...</div>
  </header>

  <div class="selector-section">
    <div class="selector-label">Selecionar usuário</div>
    <div class="user-grid" id="user-grid">
      <div style="color:var(--muted);font-size:13px;">Carregando usuários...</div>
    </div>
  </div>

  <div id="perfil">
    <div class="profile-card">
      <img class="profile-avatar" id="pf-avatar" src="" alt=""/>
      <div class="profile-info">
        <div class="profile-name" id="pf-name"></div>
        <div class="profile-id" id="pf-id"></div>
      </div>
      <div class="profile-stats">
        <div class="stat"><div class="stat-val" id="pf-total-h">0min</div><div class="stat-label">Esta semana</div></div>
        <div class="stat"><div class="stat-val" id="pf-dias">0</div><div class="stat-label">Dias ativos</div></div>
        <div class="stat"><div class="stat-val" id="pf-sessoes">0</div><div class="stat-label">Sessões</div></div>
      </div>
    </div>

    <div class="section-title">Presença semanal</div>
    <div class="week-grid" id="week-grid"></div>

    <div class="total-bar">
      <div>
        <div class="total-label">Total na semana</div>
        <div class="total-sessoes" id="total-sessoes-txt"></div>
      </div>
      <div class="total-val" id="total-horas-txt">0min</div>
    </div>
  </div>

  <div class="empty-state" id="empty-state">
    <div class="icon">⌁</div>
    <p>Selecione um usuário acima para ver a presença semanal</p>
  </div>
</div>

<script>
const DIAS_CORES = {
  1: { nome: 'SEG', cor: '#5865f2' },
  2: { nome: 'TER', cor: '#57f287' },
  3: { nome: 'QUA', cor: '#fee75c' },
  4: { nome: 'QUI', cor: '#eb459e' },
  5: { nome: 'SEX', cor: '#3ba55d' },
  6: { nome: 'SÁB', cor: '#ff8c00' },
};
const FALLBACK_AVATAR = 'https://cdn.discordapp.com/embed/avatars/0.png';
const query = new URLSearchParams(window.location.search);
const initialUserId = query.get('userId');
let usuarioAtual = null;

function apiUrl(path) {
  const params = new URLSearchParams();
  for (const key of ['guildId', 'token']) {
    const value = query.get(key);
    if (value) params.set(key, value);
  }
  const qs = params.toString();
  return path + (qs ? '?' + qs : '');
}
function siteUrl(path) {
  const params = new URLSearchParams();
  for (const key of ['guildId', 'token']) {
    const value = query.get(key);
    if (value) params.set(key, value);
  }
  const qs = params.toString();
  return path + (qs ? '?' + qs : '');
}
function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function getSemana() {
  const hoje = new Date();
  const diaSemana = hoje.getDay();
  const seg = new Date(hoje);
  seg.setDate(hoje.getDate() - (diaSemana === 0 ? 6 : diaSemana - 1));
  seg.setHours(0,0,0,0);
  return Array.from({ length: 6 }, (_, i) => {
    const d = new Date(seg);
    d.setDate(seg.getDate() + i);
    return d;
  });
}
function getFimSemana(semana) {
  const fim = new Date(semana[5]);
  fim.setHours(23, 59, 59, 999);
  return fim;
}
function fmtHora(min) {
  const h = Math.floor(min / 60);
  const m = min % 60;
  if (h === 0) return `${m}min`;
  if (m === 0) return `${h}h`;
  return `${h}h ${m}min`;
}
function fmtClock(isoStr) {
  const d = new Date(isoStr);
  return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function fmtData(d) {
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
}
function mesmoDia(isoStr, dia) {
  const d = new Date(isoStr);
  return d.getFullYear() === dia.getFullYear() &&
         d.getMonth() === dia.getMonth() &&
         d.getDate() === dia.getDate();
}
async function carregarUsuarios() {
  try {
    const res = await fetch(apiUrl('/api/usuarios'), { cache: 'no-store' });
    const lista = await res.json();
    if (!res.ok) throw new Error(lista.error || lista.erro || 'Erro ao carregar usuários');
    const grid = document.getElementById('user-grid');

    if (!Array.isArray(lista) || lista.length === 0) {
      grid.innerHTML = '<div style="color:var(--muted);font-size:13px;">Nenhum usuário encontrado em commands/pontos.json.</div>';
      return;
    }

    grid.innerHTML = '';
    let initialButton = null;
    lista.forEach((u) => {
      const btn = document.createElement('button');
      btn.className = 'user-btn';
      btn.dataset.id = u.id;
      btn.innerHTML = `
        <img src="${escapeHtml(u.avatar || FALLBACK_AVATAR)}" onerror="this.src='${FALLBACK_AVATAR}'" alt=""/>
        <span>${escapeHtml(u.username)}</span>
        <span class="dot"></span>
      `;
      btn.addEventListener('click', () => selecionarUsuario(u.id, btn));
      grid.appendChild(btn);
      if (initialUserId && u.id === initialUserId) initialButton = btn;
    });

    if (initialUserId && !usuarioAtual) {
      if (initialButton) {
        await selecionarUsuario(initialUserId, initialButton);
      } else {
        await selecionarUsuario(initialUserId, null);
      }
    }
  } catch(e) {
    document.getElementById('user-grid').innerHTML =
      '<div style="color:var(--danger);font-size:13px;">Erro ao carregar usuários.</div>';
  }
}
async function selecionarUsuario(id, btnEl) {
  document.querySelectorAll('.user-btn').forEach(b => b.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');

  try {
    const res = await fetch(apiUrl(`/api/usuario/${id}`), { cache: 'no-store' });
    const dados = await res.json();
    if (!res.ok) throw new Error(dados.error || dados.erro || 'Erro ao carregar usuário');
    usuarioAtual = dados;
    renderPerfil(dados);
  } catch(e) {
    alert('Erro ao carregar usuário.');
  }
}
function renderPerfil(dados) {
  const semana = getSemana();
  const fimSemana = getFimSemana(semana);
  document.getElementById('semana-range').textContent = `${fmtData(semana[0])} -> ${fmtData(semana[5])}`;
  document.getElementById('pf-avatar').src = dados.avatar || FALLBACK_AVATAR;
  document.getElementById('pf-name').textContent = dados.username;
  document.getElementById('pf-id').textContent = `ID: ${dados.id}`;
  const fullUrl = siteUrl(`/ponto/${dados.id}`);

  const sessoesNaSemana = (dados.sessoes || []).filter((s) => {
    const d = new Date(s.entrou);
    return d >= semana[0] && d <= fimSemana && d.getDay() !== 0;
  });
  const totalMin = sessoesNaSemana.reduce((acc, s) => acc + (Number(s.duracaoMin) || 0), 0);
  const diasAtivos = new Set(sessoesNaSemana.map(s => new Date(s.entrou).toDateString())).size;
  const maxMin = Math.max(...semana.map((dia) => {
    return sessoesNaSemana
      .filter(s => mesmoDia(s.entrou, dia))
      .reduce((acc, s) => acc + (Number(s.duracaoMin) || 0), 0);
  }), 1);

  document.getElementById('pf-total-h').textContent = fmtHora(totalMin);
  document.getElementById('pf-dias').textContent = diasAtivos;
  document.getElementById('pf-sessoes').textContent = sessoesNaSemana.length;
  document.getElementById('total-horas-txt').textContent = fmtHora(totalMin);
  document.getElementById('total-sessoes-txt').innerHTML =
    `${sessoesNaSemana.length} sessão${sessoesNaSemana.length !== 1 ? 'ões' : ''} registrada${sessoesNaSemana.length !== 1 ? 's' : ''} | <a href="${escapeHtml(fullUrl)}">Histórico completo</a>`;

  const grid = document.getElementById('week-grid');
  grid.innerHTML = '';
  semana.forEach((dia) => {
    const config = DIAS_CORES[dia.getDay()] || { nome: '?', cor: '#888' };
    const sessoesHoje = sessoesNaSemana.filter(s => mesmoDia(s.entrou, dia));
    const minHoje = sessoesHoje.reduce((acc, s) => acc + (Number(s.duracaoMin) || 0), 0);
    const ativo = minHoje > 0;
    const pct = Math.round((minHoje / maxMin) * 100);
    const card = document.createElement('div');
    card.className = 'day-card' + (ativo ? ' ativo' : ' vazio');
    card.style.setProperty('--day-color', config.cor);
    const sessoesHtml = sessoesHoje.map(s => `
      <div class="sessao-pill">
        <span class="horario">${fmtClock(s.entrou)} -> ${fmtClock(s.saiu)}</span>
        <span class="duracao">${fmtHora(Number(s.duracaoMin) || 0)}</span>
      </div>
    `).join('');
    card.innerHTML = `
      <div class="day-header">
        <div class="day-name">${config.nome}</div>
        <div class="day-date">${fmtData(dia)}</div>
      </div>
      <div class="day-horas">${Math.floor(minHoje/60)}<span>h</span>${String(minHoje%60).padStart(2,'0')}<span>min</span></div>
      <div class="day-bar-wrap"><div class="day-bar" style="width:${ativo ? pct : 0}%"></div></div>
      ${ativo ? `<div class="day-sessoes">${sessoesHtml}</div>` : ''}
    `;
    grid.appendChild(card);
  });
  document.getElementById('perfil').classList.add('visible');
  document.getElementById('empty-state').style.display = 'none';
}
carregarUsuarios();
setInterval(async () => {
  await carregarUsuarios();
  if (!usuarioAtual) return;
  const activeBtn = document.querySelector(`.user-btn[data-id="${CSS.escape(usuarioAtual.id)}"]`);
  if (activeBtn) activeBtn.classList.add('active');
  const res = await fetch(apiUrl(`/api/usuario/${usuarioAtual.id}`), { cache: 'no-store' });
  if (!res.ok) return;
  usuarioAtual = await res.json();
  renderPerfil(usuarioAtual);
}, 30000);
</script>
</body>
</html>
