services:
  postgres:
    image: postgres:16-alpine
    container_name: vortex-frequency-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vortex_frequency
      POSTGRES_USER: vortex
      POSTGRES_PASSWORD: vortex
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  postgres-data:
