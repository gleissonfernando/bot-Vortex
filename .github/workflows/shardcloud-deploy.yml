name: Deploy Vortex to Shard Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: shardcloud-vortex-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SHARDCLOUD_API_TOKEN: ${{ secrets.SHARD_CLOUD_API_KEY || secrets.SHARDCLOUD_API_TOKEN }}
      SHARDCLOUD_APP_ID: ${{ secrets.SHARDCLOUD_APP_ID || vars.SHARDCLOUD_APP_ID || 'ccc23af3-03b5-4174-8143-f9da45518d1c' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate ShardCloud credentials
        run: |
          test -n "$SHARDCLOUD_API_TOKEN" || (echo "::error::Missing SHARD_CLOUD_API_KEY secret. Create it with an API key from Shard Cloud Dashboard > Config > Integrations." && exit 1)
          test -n "$SHARDCLOUD_APP_ID" || (echo "::error::Missing SHARDCLOUD_APP_ID secret or variable." && exit 1)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frequency-panel/package-lock.json

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: ShardCloud preflight
        run: npm run deploy:check

      - name: Remove CI-only files before deploy
        run: |
          rm -rf node_modules
          rm -rf frequency-panel/node_modules
          rm -rf frequency-panel/apps/api/node_modules
          rm -rf frequency-panel/apps/bot/node_modules
          rm -rf frequency-panel/apps/web/node_modules
          rm -rf frequency-panel/apps/web/.next/cache
          rm -f package-lock.json frequency-panel/package-lock.json
          rm -f .env .env.*

      - name: Commit and restart Shard Cloud app
        uses: shard-cloud/action@main
        with:
          token: ${{ env.SHARDCLOUD_API_TOKEN }}
          commands: |
            commit ${{ env.SHARDCLOUD_APP_ID }}
            restart ${{ env.SHARDCLOUD_APP_ID }}
