name: Deploy ShardCloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deploy package
        run: npm run deploy:check

      - name: Build runtime artifacts
        run: npm run build

      - name: Read ShardCloud app id
        id: shardcloud
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^APPID=' .shardcloud
          app_id="$(grep -E '^APPID=' .shardcloud | head -n1 | cut -d= -f2- | tr -d '[:space:]')"
          if [ -z "$app_id" ]; then
            echo "APPID vazio em .shardcloud" >&2
            exit 1
          fi
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"

      - name: Prepare ShardCloud package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          rm -rf frequency-panel/node_modules
          rm -rf frequency-panel/apps/api/node_modules
          rm -rf frequency-panel/apps/bot/node_modules
          rm -rf frequency-panel/apps/web/node_modules
          rm -rf frequency-panel/apps/web/.next
          rm -rf .git .github
          rm -f .env .env.*
          rm -f commands/perfis.json
          rm -f commands/pointTranscripts.json
          rm -f commands/orderSettings.json
          rm -f commands/orders.json
          rm -f commands/orderLogs.json
          rm -f commands/bauStorage.json
          rm -f commands/pontos.json

      - name: Deploy to ShardCloud
        uses: shard-cloud/action@main
        env:
          SHARD_CLOUD_API_KEY: ${{ secrets.SHARD_CLOUD_API_KEY }}
        with:
          commands: |
            commit ${{ steps.shardcloud.outputs.app_id }}
            restart ${{ steps.shardcloud.outputs.app_id }}

      - name: Validate public ShardCloud runtime
        shell: bash
        env:
          SHARD_CLOUD_API_KEY: ${{ secrets.SHARD_CLOUD_API_KEY }}
        run: |
          set -euo pipefail
          url="https://bot-vortex.shardweb.app"
          ok=0
          curl -fsS --max-time 20 "$url/health" && ok=1 || true
          for endpoint in "/health" "/_shardcloud/health" "/api/health"; do
            if curl -fsS --max-time 20 "$url$endpoint"; then
              ok=1
              break
            fi
          done
          curl -fsS --max-time 20 "https://shardcloud.app/api/apps/${{ steps.shardcloud.outputs.app_id }}" \
            -H "Authorization: Bearer ${SHARD_CLOUD_API_KEY}" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const app=JSON.parse(s); console.log(JSON.stringify({name: app.name, status: app.status, ram: app.ram, vcpu: app.vcpu}, null, 2));})" \
            || true
          if [ "$ok" != "1" ]; then
            echo "vortex-frequency-api nao respondeu nos health checks publicos" >&2
            exit 1
          fi
