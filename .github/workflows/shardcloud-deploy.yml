name: Deploy to Shard Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SHARDCLOUD_API_TOKEN: ${{ secrets.SHARD_CLOUD_API_KEY || secrets.SHARDCLOUD_API_TOKEN }}
      SHARDCLOUD_APP_ID: ${{ secrets.SHARDCLOUD_APP_ID || vars.SHARDCLOUD_APP_ID || 'ccc23af3-03b5-4174-8143-f9da45518d1c' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          test -n "$SHARDCLOUD_API_TOKEN" || (echo "Missing SHARD_CLOUD_API_KEY secret" && exit 1)
          test -n "$SHARDCLOUD_APP_ID" || (echo "Missing SHARDCLOUD_APP_ID secret or variable" && exit 1)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frequency-panel/package-lock.json

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: ShardCloud preflight
        run: npm run deploy:check

      - name: Build deployment archive
        run: |
          zip -qr shardcloud-project.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x "frequency-panel/node_modules/*" \
            -x "frequency-panel/apps/*/node_modules/*" \
            -x "frequency-panel/apps/web/.next/cache/*" \
            -x ".env" \
            -x ".env.*" \
            -x "logs/*" \
            -x "commands/approvedSetChannels.json" \
            -x "commands/ausencias.json" \
            -x "commands/config.json" \
            -x "commands/dailyPointTranscriptState.json" \
            -x "commands/nicks_originais.json" \
            -x "commands/pedidos_ativos.json" \
            -x "commands/perfis.json" \
            -x "commands/perfisConfig.json" \
            -x "commands/pointAutomationState.json" \
            -x "commands/pointTranscripts.json" \
            -x "commands/pontoAdjustRequests.json" \
            -x "commands/pontoPanels.json" \
            -x "commands/pontos.json" \
            -x "commands/queuedChannelLogs.json" \
            -x "commands/scheduled_messages.json" \
            -x "commands/stats.json"

      - name: Upload code to Shard Cloud
        run: |
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --write-out "%{http_code}" --output "$response_file" --request PUT \
            --url "https://shardcloud.app/api/apps/${SHARDCLOUD_APP_ID}/file" \
            --header "Authorization: Bearer ${SHARDCLOUD_API_TOKEN}" \
            --form "project=@shardcloud-project.zip;type=application/zip")"
          cat "$response_file"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            if grep -qi "user cannot update project" "$response_file"; then
              echo "::error::ShardCloud recusou o upload: o token configurado no GitHub nao tem permissao para atualizar o projeto ${SHARDCLOUD_APP_ID}."
              echo "::error::Crie/atualize o secret SHARD_CLOUD_API_KEY com uma API key do mesmo usuario dono do app na ShardCloud, ou ajuste SHARDCLOUD_APP_ID para o app correto."
            fi
            exit 1
          fi

      - name: Restart Shard Cloud app
        run: |
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --write-out "%{http_code}" --output "$response_file" --request POST \
            --url "https://shardcloud.app/api/apps/${SHARDCLOUD_APP_ID}/status" \
            --header "Authorization: Bearer ${SHARDCLOUD_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"status":"restart"}')"
          cat "$response_file"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            if grep -qi "user cannot update project" "$response_file"; then
              echo "::error::ShardCloud recusou o restart: o token configurado no GitHub nao tem permissao para atualizar o projeto ${SHARDCLOUD_APP_ID}."
              echo "::error::Crie/atualize o secret SHARD_CLOUD_API_KEY com uma API key do mesmo usuario dono do app na ShardCloud, ou ajuste SHARDCLOUD_APP_ID para o app correto."
            fi
            exit 1
          fi
